<div class="min-h-[85vh] flex items-center justify-center p-4 relative">

  <div
    *ngIf="toast().show"
    [ngClass]="{
      'bg-slate-900 border-purple-500/40 text-white': toast().type === 'info',
      'bg-emerald-950 border-emerald-500/40 text-emerald-100': toast().type === 'success',
      'bg-rose-950 border-rose-500/40 text-rose-100': toast().type === 'error'
    }"
    class="fixed top-20 right-4 sm:right-8 z-50 px-5 py-4 rounded-2xl shadow-2xl border flex items-center gap-3.5 animate-bounce max-w-sm transition-all"
  >
    <span class="text-xl">
      {{ toast().type === 'success' ? '✅' : toast().type === 'error' ? '⚠️' : 'ℹ️' }}
    </span>
    <div class="flex-1">
      <h4 class="font-extrabold text-xs uppercase tracking-wider mb-0.5">
        {{ toast().type === 'success' ? 'Sucesso' : toast().type === 'error' ? 'Atenção' : 'Informativo' }}
      </h4>
      <p class="text-xs font-medium opacity-90 leading-snug">{{ toast().message }}</p>
    </div>
  </div>

  <!-- Card do Formulário -->
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8">

    <!-- Header do Card -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg shadow-purple-500/30 mb-3">
        🛠️
      </div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Elas Fazem</h1>
      <p class="text-slate-500 text-sm mt-1 font-medium">Serviços exclusivos por & para mulheres</p>
    </div>

    <!-- Toggle Entrar / Criar Conta -->
    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
      <button
        type="button"
        (click)="isRegister.set(false)"
        [ngClass]="{'bg-white shadow-md text-purple-700 font-extrabold': !isRegister(), 'text-slate-500 font-semibold': isRegister()}"
        class="flex-1 py-2.5 text-xs rounded-xl transition duration-200"
      >
        Entrar
      </button>
      <button
        type="button"
        (click)="isRegister.set(true)"
        [ngClass]="{'bg-white shadow-md text-purple-700 font-extrabold': isRegister(), 'text-slate-500 font-semibold': !isRegister()}"
        class="flex-1 py-2.5 text-xs rounded-xl transition duration-200"
      >
        Criar Conta
      </button>
    </div>

    <!-- Formulário -->
    <form (ngSubmit)="handleSubmit()" class="space-y-4">

      <!-- Seleção de Tipo de Perfil (Apenas Cadastro) -->
      <div *ngIf="isRegister()">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tipo de Conta</label>
        <div class="grid grid-cols-2 gap-3 mb-2">
          <button
            type="button"
            (click)="isProvider = false"
            [ngClass]="{'border-purple-600 bg-purple-50 text-purple-700 font-extrabold shadow-sm': !isProvider, 'border-slate-200 bg-slate-50 text-slate-500': isProvider}"
            class="p-3 border-2 rounded-xl text-xs flex flex-col items-center gap-1 transition"
          >
            <span class="text-xl">👤</span>
            <span>Cliente</span>
          </button>
          <button
            type="button"
            (click)="isProvider = true"
            [ngClass]="{'border-purple-600 bg-purple-50 text-purple-700 font-extrabold shadow-sm': isProvider, 'border-slate-200 bg-slate-50 text-slate-500': !isProvider}"
            class="p-3 border-2 rounded-xl text-xs flex flex-col items-center gap-1 transition"
          >
            <span class="text-xl">🛠️</span>
            <span>Prestadora</span>
          </button>
        </div>
      </div>

      <!-- Campo Nome Completo (Apenas Cadastro) -->
      <div *ngIf="isRegister()">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nome Completo</label>
        <input
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          required
          placeholder="Seu nome completo"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white text-sm font-medium transition"
        />
      </div>

      <!-- Campo E-mail -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">E-mail</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="seu@email.com"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white text-sm font-medium transition"
        />
      </div>

      <!-- Campo Senha com Botão Espiar -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Senha</label>
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white text-sm font-medium transition"
          />
          <button
            type="button"
            (click)="toggleShowPassword()"
            class="absolute right-3 top-3 text-slate-400 hover:text-purple-600 text-sm font-bold p-1 rounded-md transition"
            [title]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          >
            {{ showPassword() ? '👁️' : '🙈' }}
          </button>
        </div>
      </div>

      <!-- Campo Confirmar Senha com Botão Espiar (Apenas Cadastro) -->
      <div *ngIf="isRegister()">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Confirmar Senha</label>
        <div class="relative">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="••••••••"
            class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white text-sm font-medium transition"
          />
          <button
            type="button"
            (click)="toggleShowConfirmPassword()"
            class="absolute right-3 top-3 text-slate-400 hover:text-purple-600 text-sm font-bold p-1 rounded-md transition"
            [title]="showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          >
            {{ showConfirmPassword() ? '👁️' : '🙈' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-purple-700 to-pink-600 hover:from-purple-800 hover:to-pink-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-purple-500/20 transition active:scale-98 mt-2"
      >
        {{ isRegister() ? 'Finalizar Cadastro' : 'Entrar' }}
      </button>
    </form>

  </div>
</div>
